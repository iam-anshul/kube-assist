apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deploy
spec:
  selector:
    matchLabels:
      app: apache-deploy
  template:
    metadata:
      labels:
        app: apache-deploy
    spec:
      containers:
      - name: apache-deploy
        image: nginx
        resources:
          limits:
            memory: "128Mi"
            cpu: "50m"
        ports:
        - containerPort: 80
